[project]
name = "astracare-backend"
version = "0.3.0"
description = "AstraCare AI — Adaptive Individual Baseline, Contextual Intelligence, Explainable ML, Closed-Loop Follow-Up & Earth Continuity Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "scikit-learn>=1.5.2",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

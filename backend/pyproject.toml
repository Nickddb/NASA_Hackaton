[project]
name = "astracare-backend"
version = "0.1.0"
description = "AstraCare AI — Autonomous Offline-First Spaceflight Medical Officer Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "scikit-learn>=1.5.2",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-google-genai>=2.0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
